name: CI Pipeline

on:
  push:
    branches: [main, "sparra/prod/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: eliteshop_test
          POSTGRES_USER: eliteshop
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eliteshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Check formatting
        run: ./mvnw spotless:check

      - name: Compile
        run: ./mvnw compile

      - name: Run tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eliteshop_test
          SPRING_DATASOURCE_USERNAME: eliteshop
          SPRING_DATASOURCE_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-key-for-testing-only-minimum-32-bytes
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: test-access
          MINIO_SECRET_KEY: test-secret
          FACE_MATCHER_URL: http://localhost:5000
          PAYMENT_EPAYCO_PUBLIC_KEY: test
          PAYMENT_EPAYCO_PRIVATE_KEY: test
          PAYMENT_EPAYCO_P_KEY: test
          PAYMENT_EPAYCO_INTEGRATION_ID: test
          PAYMENT_BASE_URL: http://localhost:8080
          CONFIG_SERVER_ENABLED: "false"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
