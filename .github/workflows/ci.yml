name: CI Pipeline

on:
  push:
    branches: [main, "sparra/prod/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Check formatting
        run: ./mvnw spotless:check

      - name: Compile
        run: ./mvnw compile

      - name: Run tests
        run: ./mvnw test
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: test-access
          MINIO_SECRET_KEY: test-secret
          FACE_MATCHER_URL: http://localhost:5000
          PAYMENT_EPAYCO_PUBLIC_KEY: test
          PAYMENT_EPAYCO_PRIVATE_KEY: test
          PAYMENT_EPAYCO_P_KEY: test
          PAYMENT_EPAYCO_INTEGRATION_ID: test
          PAYMENT_BASE_URL: http://localhost:8080
          CONFIG_SERVER_ENABLED: "false"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
