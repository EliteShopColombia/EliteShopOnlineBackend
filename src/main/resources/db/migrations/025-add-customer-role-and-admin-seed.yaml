databaseChangeLog:
  - changeSet:
      id: 025-add-customer-role-column
      author: eliteshop
      changes:
        - addColumn:
            tableName: customer
            columns:
              - column:
                  name: customer_role
                  type: varchar(20)
                  defaultValue: 'customer'
                  constraints:
                    nullable: false

