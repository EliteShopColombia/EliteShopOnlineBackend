databaseChangeLog:
  - changeSet:
      id: 009-create-product-image-table
      author: eliteshop
      changes:
        - createTable:
            tableName: product_image
            columns:
              - column:
                  name: image_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: image_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: product_image
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: product_id
            constraintName: fk_product_image_product
            onDelete: CASCADE
        - createIndex:
            tableName: product_image
            indexName: idx_product_image_product_id
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: 009-create-review-image-table
      author: eliteshop
      changes:
        - createTable:
            tableName: review_image
            columns:
              - column:
                  name: image_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: review_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: image_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: review_image
            baseColumnNames: review_id
            referencedTableName: product_review
            referencedColumnNames: review_id
            constraintName: fk_review_image_review
            onDelete: CASCADE
        - createIndex:
            tableName: review_image
            indexName: idx_review_image_review_id
            columns:
              - column:
                  name: review_id
