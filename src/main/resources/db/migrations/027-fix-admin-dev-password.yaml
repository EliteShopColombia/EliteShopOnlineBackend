databaseChangeLog:
  - changeSet:
      id: 027-fix-admin-dev-password
      author: eliteshop
      # Solo desarrollo. El hash ya no está fijo en el migration: se inyecta por
      # propiedad, de modo que la contraseña no queda versionada en el repo.
      context: dev
      validCheckSum: "9:3c8ffffb705512ea0cf340adbe0cc4aa"
      changes:
        - sql:
            sql: |
              UPDATE customer
              SET customer_password = ${adminDevPasswordHash}
              WHERE customer_email = 'admin-dev@eliteshop.com';
