services:
  postgres:
    image: postgres:15-alpine
    container_name: eliteshop-postgres
    environment:
      POSTGRES_DB: eliteshop
      POSTGRES_USER: eliteshop
      POSTGRES_PASSWORD: eliteshop
    ports:
      - "5432:5432"
    volumes:
      - ./src/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eliteshop -d eliteshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/docker/Dockerfile
    container_name: eliteshop-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
    restart: unless-stopped
